name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# SEC-070: permisos mínimos por defecto (solo lectura del repositorio).
permissions:
  contents: read

jobs:
  quality:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    # packages/config/env.ts exige DATABASE_URL al importarse (tests y next build
    # ejecutan modulos). Valor dummy: CI no toca una BD real aqui.
    env:
      DATABASE_URL: postgresql://ci:***@localhost:5432/ci
      # packages/config/env.ts exige CONNECTOR_ENCRYPTION_KEY (SEC-041/SEC-076,
      # sin valor por defecto). Dummy de CI: no cifra datos reales.
      CONNECTOR_ENCRYPTION_KEY: ci-connector-encryption-key-0000000000
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABASE_URL: postgresql://ci:***@localhost:5432/ci
      # packages/config/env.ts exige CONNECTOR_ENCRYPTION_KEY (SEC-041/SEC-076,
      # sin valor por defecto). Dummy de CI: no cifra datos reales.
      CONNECTOR_ENCRYPTION_KEY: ci-connector-encryption-key-0000000000
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Escaneo de secretos en el contenido del repo (SEC-070). Imagen fija para
      # evitar dependencias de licencia; allowlist en .gitleaks.toml.
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.18.4 detect \
            --source=/repo --config=/repo/.gitleaks.toml --redact --no-git --exit-code=1

      # Revisión de dependencias en PRs (vulnerabilidades conocidas).
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust (Linux/macOS)
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop
        working-directory: apps/desktop
        run: pnpm tauri build

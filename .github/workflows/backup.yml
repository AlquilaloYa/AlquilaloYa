name: Backup DB

# Copia de seguridad diaria de la base de datos (Fase 8 - DR).
# Sube el dump como artefacto del repositorio con retención de 30 días.
# Requiere el secret DATABASE_URL (String) en la configuración del repo.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC diario
  workflow_dispatch:

jobs:
  backup:
    name: Volcado pg_dump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Generar backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/backup.sh backups

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/*.dump*
          retention-days: 30

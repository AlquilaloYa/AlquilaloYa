title = "AlquilaYa ERP — configuracion gitleaks (SEC-070)"

# Usar el conjunto de reglas por defecto + reglas propias.
[extend]
useDefault = true

[allowlist]
description = "Valores de ejemplo, dummies de CI, fixtures de test y documentacion (no son secretos reales)"
paths = [
  '''(^|[\\/])\.env\.example$''',
  '''(^|[\\/])docs[\\/]security[\\/].*\.md$''',
  '''(^|[\\/])dev[\\/]null$''',
  '''(^|[\\/])packages[\\/]db[\\/]debug-snap\.mjs$''',
  '''(^|[\\/])packages[\\/]db[\\/]src[\\/]crypto[\\/]credential-cipher\.test\.ts$''',
  '''(^|[\\/])packages[\\/]config[\\/]src[\\/]production-secrets\.test\.ts$''',
]
regexes = [
  '''ci-connector-encryption-key''',
  '''postgresql://ci:''',
  '''sc_inventarios_departamento_v1''',
]

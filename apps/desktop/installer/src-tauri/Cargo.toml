[package]
name = "alquilaya-erp-installer"
version = "0.1.0"
description = "Instalador personalizado de AlquilaYa ERP"
authors = ["AlquilaYa"]
edition = "2021"

[lib]
name = "alquilaya_erp_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
